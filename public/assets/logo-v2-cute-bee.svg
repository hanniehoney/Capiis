<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Ver 2: Cute bee character — kawaii style, inspired by pixel mascots -->

  <!-- Body (round, chunky) -->
  <ellipse cx="64" cy="62" rx="24" ry="22" fill="#2d4a2b"/>

  <!-- Belly stripes -->
  <ellipse cx="64" cy="62" rx="24" ry="22" fill="none" stroke="#faf9f6" stroke-width="0" />
  <path d="M 42,56 Q 64,52 86,56" stroke="#faf9f6" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M 40,64 Q 64,60 88,64" stroke="#faf9f6" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M 42,72 Q 64,68 86,72" stroke="#faf9f6" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Face -->
  <!-- Eyes (big, cute) -->
  <ellipse cx="55" cy="58" rx="4.5" ry="5" fill="#faf9f6"/>
  <ellipse cx="73" cy="58" rx="4.5" ry="5" fill="#faf9f6"/>
  <!-- Pupils -->
  <circle cx="56.5" cy="59" r="2.5" fill="#1a2e19"/>
  <circle cx="74.5" cy="59" r="2.5" fill="#1a2e19"/>
  <!-- Eye shine -->
  <circle cx="55" cy="57" r="1.2" fill="#faf9f6"/>
  <circle cx="73" cy="57" r="1.2" fill="#faf9f6"/>
  <!-- Smile -->
  <path d="M 58,67 Q 64,72 70,67" stroke="#faf9f6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="50" cy="66" rx="3.5" ry="2" fill="rgba(164,172,134,0.5)"/>
  <ellipse cx="78" cy="66" rx="3.5" ry="2" fill="rgba(164,172,134,0.5)"/>

  <!-- Antennae -->
  <path d="M 56,41 Q 52,30 48,26" stroke="#2d4a2b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 72,41 Q 76,30 80,26" stroke="#2d4a2b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="47" cy="25" r="3" fill="#2d4a2b"/>
  <circle cx="81" cy="25" r="3" fill="#2d4a2b"/>

  <!-- Wings (translucent, round) -->
  <ellipse cx="38" cy="48" rx="14" ry="10" fill="rgba(45,74,43,0.12)" stroke="#2d4a2b" stroke-width="1.2"/>
  <ellipse cx="90" cy="48" rx="14" ry="10" fill="rgba(45,74,43,0.12)" stroke="#2d4a2b" stroke-width="1.2"/>

  <!-- Little legs -->
  <line x1="54" y1="82" x2="52" y2="90" stroke="#2d4a2b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="84" x2="64" y2="92" stroke="#2d4a2b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="82" x2="76" y2="90" stroke="#2d4a2b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Text -->
  <text x="64" y="112" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#2d4a2b" letter-spacing="1.5">CAPIS</text>
</svg>
