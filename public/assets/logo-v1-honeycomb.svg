<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Ver 1: Honeycomb with flying bee — dynamic/lively feel -->

  <!-- Honeycomb cluster (3 hexagons) -->
  <g transform="translate(36, 32)">
    <!-- Top hex -->
    <polygon points="28,0 48,12 48,34 28,46 8,34 8,12" stroke="#2d4a2b" stroke-width="2" fill="rgba(45,74,43,0.06)"/>
    <!-- Bottom-left hex -->
    <polygon points="8,34 28,46 28,68 8,80 -12,68 -12,46" stroke="#2d4a2b" stroke-width="2" fill="rgba(45,74,43,0.10)"/>
    <!-- Bottom-right hex -->
    <polygon points="48,34 68,46 68,68 48,80 28,68 28,46" stroke="#2d4a2b" stroke-width="2" fill="rgba(45,74,43,0.14)"/>
    <!-- Center glow dot -->
    <circle cx="28" cy="46" r="5" fill="rgba(45,74,43,0.25)"/>
  </g>

  <!-- Flying bee -->
  <g transform="translate(92, 28)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="7" ry="5.5" fill="#2d4a2b"/>
    <!-- Stripes -->
    <line x1="-2" y1="-5.2" x2="-2" y2="5.2" stroke="#faf9f6" stroke-width="1.5" opacity="0.5"/>
    <line x1="3" y1="-4.5" x2="3" y2="4.5" stroke="#faf9f6" stroke-width="1.5" opacity="0.5"/>
    <!-- Wings -->
    <ellipse cx="-4" cy="-8" rx="5" ry="7" fill="rgba(45,74,43,0.15)" stroke="#2d4a2b" stroke-width="0.8"/>
    <ellipse cx="3" cy="-9" rx="4.5" ry="6" fill="rgba(45,74,43,0.10)" stroke="#2d4a2b" stroke-width="0.8"/>
    <!-- Eye -->
    <circle cx="5.5" cy="-1.5" r="1.2" fill="#faf9f6"/>
    <!-- Stinger -->
    <line x1="-7" y1="0" x2="-10" y2="1" stroke="#2d4a2b" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Flight trail (dotted arc) -->
  <path d="M 88,38 Q 78,50 85,62 Q 92,72 82,78" stroke="#2d4a2b" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Tiny sparkle dots along trail -->
  <circle cx="86" cy="45" r="1" fill="#2d4a2b" opacity="0.2"/>
  <circle cx="87" cy="58" r="1.2" fill="#2d4a2b" opacity="0.15"/>
  <circle cx="83" cy="73" r="0.8" fill="#2d4a2b" opacity="0.2"/>

  <!-- Text -->
  <text x="64" y="118" text-anchor="middle" font-family="'Noto Serif', Georgia, serif" font-size="14" font-weight="600" fill="#2d4a2b" letter-spacing="2">CAPIS</text>
</svg>
