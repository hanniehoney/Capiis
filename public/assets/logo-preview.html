<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Capiis Logo</title>
<style>
  body { background: #faf9f6; font-family: 'Noto Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; gap: 20px; }
  h1 { color: #2d4a2b; font-family: 'Noto Serif', serif; margin-bottom: 10px; }
  .grid { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  .card { background: #fff; border: 1px solid rgba(45,74,43,0.15); border-radius: 12px; padding: 32px; text-align: center; width: 240px; }
  .card img { width: 160px; height: 160px; }
  .card h3 { color: #2d4a2b; margin: 16px 0 4px; font-size: 14px; }
  .card p { color: #7d8471; font-size: 12px; margin: 0; }
  .current { opacity: 0.6; }
  .current h3::after { content: " (current)"; font-weight: 400; }
</style>
</head>
<body>
  <h1>Capiis Logo</h1>
  <div class="grid">
    <div class="card current">
      <img src="logo.svg" alt="Logo SVG">
      <h3>SVG</h3>
      <p>Primary logo (no text)</p>
    </div>
    <div class="card">
      <img src="logo.png" alt="Logo PNG">
      <h3>PNG</h3>
      <p>Primary logo (no text)</p>
    </div>
  </div>
</body>
</html>
