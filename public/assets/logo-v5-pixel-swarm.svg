<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Ver 5: Pixel swarm — V3 style, one main bee + two small bees -->

  <!-- ====== Main bee (center, 6px grid) ====== -->
  <g transform="translate(28, 18)">
    <!-- Antennae -->
    <rect x="18" y="0" width="6" height="6" fill="#2d4a2b"/>
    <rect x="36" y="0" width="6" height="6" fill="#2d4a2b"/>
    <rect x="18" y="6" width="6" height="6" fill="#2d4a2b"/>
    <rect x="36" y="6" width="6" height="6" fill="#2d4a2b"/>

    <!-- Head row 1 -->
    <rect x="12" y="12" width="6" height="6" fill="#2d4a2b"/>
    <rect x="18" y="12" width="6" height="6" fill="#2d4a2b"/>
    <rect x="24" y="12" width="6" height="6" fill="#2d4a2b"/>
    <rect x="30" y="12" width="6" height="6" fill="#2d4a2b"/>
    <rect x="36" y="12" width="6" height="6" fill="#2d4a2b"/>
    <rect x="42" y="12" width="6" height="6" fill="#2d4a2b"/>

    <!-- Head row 2 (eyes) -->
    <rect x="6" y="18" width="6" height="6" fill="#2d4a2b"/>
    <rect x="12" y="18" width="6" height="6" fill="#2d4a2b"/>
    <rect x="18" y="18" width="6" height="6" fill="#faf9f6"/>
    <rect x="24" y="18" width="6" height="6" fill="#2d4a2b"/>
    <rect x="30" y="18" width="6" height="6" fill="#2d4a2b"/>
    <rect x="36" y="18" width="6" height="6" fill="#faf9f6"/>
    <rect x="42" y="18" width="6" height="6" fill="#2d4a2b"/>
    <rect x="48" y="18" width="6" height="6" fill="#2d4a2b"/>

    <!-- Head row 3 -->
    <rect x="6" y="24" width="6" height="6" fill="#2d4a2b"/>
    <rect x="12" y="24" width="6" height="6" fill="#2d4a2b"/>
    <rect x="18" y="24" width="6" height="6" fill="#2d4a2b"/>
    <rect x="24" y="24" width="6" height="6" fill="#2d4a2b"/>
    <rect x="30" y="24" width="6" height="6" fill="#2d4a2b"/>
    <rect x="36" y="24" width="6" height="6" fill="#2d4a2b"/>
    <rect x="42" y="24" width="6" height="6" fill="#2d4a2b"/>
    <rect x="48" y="24" width="6" height="6" fill="#2d4a2b"/>

    <!-- Body row 1 — wings + dark stripe -->
    <rect x="-6" y="30" width="6" height="6" fill="rgba(45,74,43,0.25)"/>
    <rect x="0" y="30" width="6" height="6" fill="rgba(45,74,43,0.25)"/>
    <rect x="6" y="30" width="6" height="6" fill="#2d4a2b"/>
    <rect x="12" y="30" width="6" height="6" fill="#2d4a2b"/>
    <rect x="18" y="30" width="6" height="6" fill="#2d4a2b"/>
    <rect x="24" y="30" width="6" height="6" fill="#2d4a2b"/>
    <rect x="30" y="30" width="6" height="6" fill="#2d4a2b"/>
    <rect x="36" y="30" width="6" height="6" fill="#2d4a2b"/>
    <rect x="42" y="30" width="6" height="6" fill="#2d4a2b"/>
    <rect x="48" y="30" width="6" height="6" fill="#2d4a2b"/>
    <rect x="54" y="30" width="6" height="6" fill="rgba(45,74,43,0.25)"/>
    <rect x="60" y="30" width="6" height="6" fill="rgba(45,74,43,0.25)"/>

    <!-- Body row 2 — olive stripe -->
    <rect x="6" y="36" width="6" height="6" fill="#a4ac86"/>
    <rect x="12" y="36" width="6" height="6" fill="#a4ac86"/>
    <rect x="18" y="36" width="6" height="6" fill="#a4ac86"/>
    <rect x="24" y="36" width="6" height="6" fill="#a4ac86"/>
    <rect x="30" y="36" width="6" height="6" fill="#a4ac86"/>
    <rect x="36" y="36" width="6" height="6" fill="#a4ac86"/>
    <rect x="42" y="36" width="6" height="6" fill="#a4ac86"/>
    <rect x="48" y="36" width="6" height="6" fill="#a4ac86"/>

    <!-- Body row 3 — dark stripe -->
    <rect x="6" y="42" width="6" height="6" fill="#2d4a2b"/>
    <rect x="12" y="42" width="6" height="6" fill="#2d4a2b"/>
    <rect x="18" y="42" width="6" height="6" fill="#2d4a2b"/>
    <rect x="24" y="42" width="6" height="6" fill="#2d4a2b"/>
    <rect x="30" y="42" width="6" height="6" fill="#2d4a2b"/>
    <rect x="36" y="42" width="6" height="6" fill="#2d4a2b"/>
    <rect x="42" y="42" width="6" height="6" fill="#2d4a2b"/>
    <rect x="48" y="42" width="6" height="6" fill="#2d4a2b"/>

    <!-- Body row 4 — olive bottom -->
    <rect x="12" y="48" width="6" height="6" fill="#a4ac86"/>
    <rect x="18" y="48" width="6" height="6" fill="#a4ac86"/>
    <rect x="24" y="48" width="6" height="6" fill="#a4ac86"/>
    <rect x="30" y="48" width="6" height="6" fill="#a4ac86"/>
    <rect x="36" y="48" width="6" height="6" fill="#a4ac86"/>
    <rect x="42" y="48" width="6" height="6" fill="#a4ac86"/>

    <!-- Legs -->
    <rect x="12" y="54" width="6" height="6" fill="#2d4a2b"/>
    <rect x="42" y="54" width="6" height="6" fill="#2d4a2b"/>
  </g>

  <!-- ====== Small bee top-right (4px grid) ====== -->
  <g transform="translate(92, 10)">
    <!-- Antenna -->
    <rect x="4" y="0" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="0" width="4" height="4" fill="#2d4a2b"/>
    <!-- Head -->
    <rect x="4" y="4" width="4" height="4" fill="#2d4a2b"/>
    <rect x="8" y="4" width="4" height="4" fill="#2d4a2b"/>
    <rect x="12" y="4" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="4" width="4" height="4" fill="#2d4a2b"/>
    <!-- Head row 2 (eyes) -->
    <rect x="0" y="8" width="4" height="4" fill="#2d4a2b"/>
    <rect x="4" y="8" width="4" height="4" fill="#2d4a2b"/>
    <rect x="8" y="8" width="4" height="4" fill="#faf9f6"/>
    <rect x="12" y="8" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="8" width="4" height="4" fill="#faf9f6"/>
    <rect x="20" y="8" width="4" height="4" fill="#2d4a2b"/>
    <!-- Body dark -->
    <rect x="0" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="4" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="8" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="12" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="20" y="12" width="4" height="4" fill="#2d4a2b"/>
    <!-- Wing hint -->
    <rect x="-4" y="12" width="4" height="4" fill="rgba(45,74,43,0.2)"/>
    <rect x="24" y="12" width="4" height="4" fill="rgba(45,74,43,0.2)"/>
    <!-- Body olive -->
    <rect x="4" y="16" width="4" height="4" fill="#a4ac86"/>
    <rect x="8" y="16" width="4" height="4" fill="#a4ac86"/>
    <rect x="12" y="16" width="4" height="4" fill="#a4ac86"/>
    <rect x="16" y="16" width="4" height="4" fill="#a4ac86"/>
    <!-- Body dark bottom -->
    <rect x="4" y="20" width="4" height="4" fill="#2d4a2b"/>
    <rect x="8" y="20" width="4" height="4" fill="#2d4a2b"/>
    <rect x="12" y="20" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="20" width="4" height="4" fill="#2d4a2b"/>
    <!-- Legs -->
    <rect x="6" y="24" width="4" height="4" fill="#2d4a2b"/>
    <rect x="14" y="24" width="4" height="4" fill="#2d4a2b"/>
  </g>

  <!-- ====== Small bee bottom-left (4px grid) ====== -->
  <g transform="translate(2, 68)">
    <!-- Antenna -->
    <rect x="4" y="0" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="0" width="4" height="4" fill="#2d4a2b"/>
    <!-- Head -->
    <rect x="4" y="4" width="4" height="4" fill="#2d4a2b"/>
    <rect x="8" y="4" width="4" height="4" fill="#2d4a2b"/>
    <rect x="12" y="4" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="4" width="4" height="4" fill="#2d4a2b"/>
    <!-- Head row 2 (eyes) -->
    <rect x="0" y="8" width="4" height="4" fill="#2d4a2b"/>
    <rect x="4" y="8" width="4" height="4" fill="#2d4a2b"/>
    <rect x="8" y="8" width="4" height="4" fill="#faf9f6"/>
    <rect x="12" y="8" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="8" width="4" height="4" fill="#faf9f6"/>
    <rect x="20" y="8" width="4" height="4" fill="#2d4a2b"/>
    <!-- Body dark -->
    <rect x="0" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="4" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="8" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="12" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="12" width="4" height="4" fill="#2d4a2b"/>
    <rect x="20" y="12" width="4" height="4" fill="#2d4a2b"/>
    <!-- Wings -->
    <rect x="-4" y="12" width="4" height="4" fill="rgba(45,74,43,0.2)"/>
    <rect x="24" y="12" width="4" height="4" fill="rgba(45,74,43,0.2)"/>
    <!-- Body olive -->
    <rect x="4" y="16" width="4" height="4" fill="#a4ac86"/>
    <rect x="8" y="16" width="4" height="4" fill="#a4ac86"/>
    <rect x="12" y="16" width="4" height="4" fill="#a4ac86"/>
    <rect x="16" y="16" width="4" height="4" fill="#a4ac86"/>
    <!-- Body dark bottom -->
    <rect x="4" y="20" width="4" height="4" fill="#2d4a2b"/>
    <rect x="8" y="20" width="4" height="4" fill="#2d4a2b"/>
    <rect x="12" y="20" width="4" height="4" fill="#2d4a2b"/>
    <rect x="16" y="20" width="4" height="4" fill="#2d4a2b"/>
    <!-- Legs -->
    <rect x="6" y="24" width="4" height="4" fill="#2d4a2b"/>
    <rect x="14" y="24" width="4" height="4" fill="#2d4a2b"/>
  </g>

  <!-- Text -->
  <text x="64" y="118" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#2d4a2b" letter-spacing="3">CAPIS</text>
</svg>
